# The layout. Single source of truth for kanata and WoW.
#
# After editing:
#   1. `cargo run` from the repo root (regenerates kanata/wow.kbd and
#      addon/WowKeys/Layout.lua).
#   2. Restart kanata.
#   3. `/reload` in WoW.
#
# Keys use kanata names (the defsrc grid in layoutgen/src/keys.rs). Quote
# punctuation keys: ";" = ...
#
# An action is one of:
#   "MOVEFORWARD"                              a WoW binding command
#   { bar = 1, button = 1, spell = "Frostbolt" }
#                                              action button; the addon puts
#                                              the spell there
#   { bar = 1, button = 8, macro = "Name", body = "..." }
#                                              same, with a macro it creates
#   { bar = 2, button = 7 }                    action button you fill by hand
#   { spell = "Frost Armor" }                  bound straight to the key, no
#   { macro = "Name", body = "..." }           bar slot (fine outside combat;
#                                              bars show cooldowns and glows)
#   "wowkeys:confirm"                          a WowKeys addon command:
#                                              confirm, vendor, choose1..9
#   { mode = "chat", send = "ret" }            switch mode, optionally sending
#                                              a key (Enter opens chat)
#
# Bars: 1 = main bar, 2..8 = Action Bar 2..8 in WoW's settings. Buttons are 1..12.
#
# Mode fields:
#   banner       key sent as Ctrl+Alt+Shift+<banner> on entering the mode;
#                the addon shows the label
#   passthrough  keys you don't map type text (chat)
#   mods         modifiers kanata adds to this mode's bound keys, so they
#                don't collide with combat, e.g. ["ctrl", "alt"]
#   oneshot      ms; the mode lasts for one key, then drops back (leader).
#                No banner.
#
# The first mode is home: kanata starts there, and the banner warns if
# combat starts anywhere else. Keys another mode doesn't map act as they do
# in home (movement, mode keys), except in passthrough modes, where they
# type.

# While any of these keys is held, every key does what it normally does in
# Windows, so Alt+Tab, Alt+Shift+Tab, Win+Tab and Ctrl+Shift+Esc work.
os_hold = ["lalt", "lctl", "lmet"]

# Game settings, applied by the addon on every login.
[cvars]
autoLootDefault = "1"            # loot corpses on interact, no loot window
AutoPushSpellToActionBar = "0"   # don't drop new spells on the bars; the
                                 # addon places them on their keys instead
nameplateShowEnemies = "0"       # off by default; leader / toggles them
# Tab targeting (Q/B). Test live with /console <name> <value> before
# changing these.
targetNearestDistance = "50"     # max search range in yards (default ~41)
TargetNearestUseNew = "0"        # older targeting: less tied to a narrow
                                 # cone in front; set "1" to go back

[[mode]]
name = "combat"
label = "COMBAT"
banner = "f9"

[mode.keys]
# Mode keys
caps = { mode = "combat" }
ret = { mode = "chat", send = "ret" }
tab = { mode = "ui" }
lsft = { mode = "world" }
ralt = { mode = "leader" }

# NPC dialogs, loot and popups, handled by the addon. Talk to an NPC with
# A, then pick an option by number (the addon prints them numbered) and
# accept / complete / turn in with G. G also accepts popups (group invites,
# resurrection) and loots everything from an open loot window.
"1" = "wowkeys:choose1"
"2" = "wowkeys:choose2"
"3" = "wowkeys:choose3"
"4" = "wowkeys:choose4"
"5" = "wowkeys:choose5"
"6" = "wowkeys:choose6"
"7" = "wowkeys:choose7"
"8" = "wowkeys:choose8"
"9" = "wowkeys:choose9"
g = "wowkeys:confirm"

# Movement (left hand)
e = "MOVEFORWARD"
d = "MOVEBACKWARD"
s = "TURNLEFT"
f = "TURNRIGHT"
w = "STRAFELEFT"
r = "STRAFERIGHT"
spc = "JUMP"
t = "TOGGLEAUTORUN"
q = "TARGETNEARESTENEMY"     # press again to cycle to the next enemy
b = "TARGETPREVIOUSENEMY"    # cycle back
a = "INTERACTTARGET"

# Frost Mage, WoW: Forever. Beta caps at 30; spells or talents you don't
# have yet are skipped (the addon lists them) until you learn them.
# Rotation (right hand, main bar)
j = { bar = 1, button = 1, spell = "Frostbolt" }
k = { bar = 1, button = 2, spell = "Ice Lance" }
l = { bar = 1, button = 3, spell = "Fire Blast" }
";" = { bar = 1, button = 4, spell = "Fireball" }
u = { bar = 1, button = 5, spell = "Arcane Missiles" }
i = { bar = 1, button = 6, spell = "Arcane Explosion" }
o = { bar = 1, button = 7, spell = "Cold Snap" }
p = { bar = 1, button = 8, macro = "Blizzard", body = "#showtooltip\n/cast [@player] Blizzard" }

# Interrupt, defensives, cooldowns
h = { bar = 1, button = 9, spell = "Counterspell" }
y = { bar = 1, button = 10, spell = "Mana Shield" }
n = { bar = 1, button = 11, spell = "Ice Block" }
m = { bar = 1, button = 12, spell = "Evocation" }
# Polymorph your focus if you have one, else your target: set a focus on
# the add, keep killing your target, sheep the add without switching.
"," = { bar = 2, button = 1, macro = "Poly", body = "#showtooltip Polymorph\n/cast [@focus,harm,nodead][] Polymorph" }
"." = { bar = 2, button = 2, spell = "Blood Fury" }   # Orc racial, every fight
"/" = { bar = 2, button = 3, spell = "Remove Lesser Curse" }

# Extras (left hand)
x = { bar = 2, button = 4, spell = "Frost Nova" }
c = { bar = 2, button = 5, spell = "Cone of Cold" }
v = { bar = 2, button = 6, spell = "Blink" }
# Mount: random favorite from the mount journal. Does nothing until you
# have one (level 40).
z = { bar = 2, button = 7, macro = "Mount", body = "/run C_MountJournal.SummonByID(0)" }

# Windows and vendors. Tab, then a key; Caps to leave. Esc closes windows.
[[mode]]
name = "ui"
label = "UI"
banner = "f10"
mods = ["ctrl", "alt"]

[mode.keys]
u = "OPENALLBAGS"
i = "TOGGLECHARACTER0"
o = "TOGGLESPELLBOOK"
p = "TOGGLETALENTS"
l = "TOGGLEQUESTLOG"
m = "TOGGLEWORLDMAP"
b = "BAGNON_BANK_TOGGLE"  # bank (Bagnon), at a banker
# Type into a text box that opened by itself (mail, search): Enter or Esc
# ends it, like chat.
"'" = { mode = "chat" }

# Out-of-combat chores. Left Shift, then a key; Caps to leave.
[[mode]]
name = "world"
label = "WORLD"
banner = "f11"
mods = ["alt", "ctrl", "shift"]

[mode.keys]
j = { spell = "Frost Armor" }       # Ice Armor replaces it at 30
k = { spell = "Arcane Intellect" }
l = { spell = "Conjure Water" }
";" = { spell = "Conjure Food" }
# Conjured item names change with each rank; update when you learn one.
u = { macro = "Drink", body = "#showtooltip\n/use Conjured Water" }
i = { macro = "Eat", body = "#showtooltip\n/use Conjured Muffin" }
h = { macro = "Hearth", body = "#showtooltip\n/use Hearthstone" }
n = "CAMERAZOOMIN"
m = "CAMERAZOOMOUT"

# Leader: Right Alt, then one key, then straight back. For things you need
# in a fight but rarely.
[[mode]]
name = "leader"
label = "LEADER"
oneshot = 1000
mods = ["ctrl"]

[mode.keys]
# Potion names change as you find better ones.
j = { macro = "HealthPot", body = "#showtooltip\n/use Minor Healing Potion" }
k = { macro = "ManaPot", body = "#showtooltip\n/use Minor Mana Potion" }
# Situational: only against frost damage. On a bar so its cooldown shows.
l = { bar = 2, button = 8, spell = "Frost Ward" }
# Focus: a second remembered target, for CC or watching an add.
f = "FOCUSTARGET"                               # current target becomes focus
t = "TARGETFOCUS"                               # target your focus
c = { macro = "ClearFocus", body = "/clearfocus" }
"/" = "NAMEPLATES" # toggle enemy nameplates; off again at login

[[mode]]
name = "chat"
label = "CHAT"
banner = "f12"
passthrough = true

[mode.keys]
# Caps must close the chat box too, or movement keys keep typing into it.
ret = { mode = "combat", send = "ret" }
esc = { mode = "combat", send = "esc" }
caps = { mode = "combat", send = "esc" }

# Controller UI layer (Steam Input): tapping Create latches a layer in which
# the controller sends the UI-mode combos below; tap Create again to leave.
# `cargo run` writes the Steam setup steps to wow/steam-layers.md.
# Inputs as in [controller]; values are keys of the named mode. Circle/B is
# left alone so it still closes windows.
[steam_layer]
mode = "ui"
button = "Create (PlayStation) / View (Xbox)"

[steam_layer.keys]
up = "i"       # character
right = "o"    # spellbook
down = "u"     # bags
left = "p"     # talents
north = "l"    # quest log
west = "m"     # map
south = "b"    # bank

# Single controller inputs Steam turns into one keyboard chord, for actions
# the Gamepad UI can't hold. WowKeysPage is a secure button that clicks the
# Gamepad UI's own change-page button (an addon may not page it directly).
# LeftButton = next arrangement, RightButton = previous (tested).
[[steam_button]]
input = "Touchpad, left half (click)"
key = "f8"
mods = ["ctrl"]
command = "CLICK WowKeysPage:LeftButton"
does = "next bar arrangement (1 → 2 → 3 → 1)"

# Controller (Forever's Gamepad UI). The addon fills these bars the same
# way it fills the keyboard bars; bind nothing by hand.
#   Layers: none (no trigger), lt, rt, ltrt (both). End a layer in 2 or 3
#   for the other bar arrangements: [controller.lt2], [controller.none3].
#   Inputs: up, right, down, left (D-pad); north, east, south, west (face:
#   Triangle/Y, Circle/B, Cross/A, Square/X). Without a trigger only the
#   D-pad is free; the face buttons are jump, interact, menu, cancel.
#   Macros defined in a mode above can be named without repeating the body.
#
# Two thumbs: the left one moves, so the D-pad is only for spells with a
# cast bar (moving cancels those anyway); the right one presses face
# buttons while you move, so instants go there. LT latches (tap on, tap
# off: the combat home layer); RT is held for a moment (see wow/setup.md).
# Arrangement 1 is combat, 2 out of combat, 3 spare; the touchpad cycles.

[controller.none]    # before the pull: focus for Polymorph
up = { macro = "SetFocus", body = "/focus" }
right = { macro = "TargetFocus", body = "/target focus" }
down = { macro = "ClearFocus" }

[controller.lt]      # combat home: latch LT when the fight starts
up = { spell = "Frostbolt" }
right = { spell = "Fireball" }
left = { macro = "Poly" }
down = { spell = "Arcane Missiles" }
south = { spell = "Ice Lance" }
west = { spell = "Frost Nova" }
north = { spell = "Fire Blast" }
east = { spell = "Blink" }

[controller.ltrt]    # LT latched + hold RT: the rest of the fight
up = { macro = "Blizzard" }
right = { spell = "Blood Fury" }
left = { spell = "Arcane Explosion" }
down = { spell = "Mana Shield" }
south = { spell = "Cone of Cold" }
west = { spell = "Counterspell" }
north = { spell = "Ice Block" }
east = { macro = "HealthPot" }

[controller.rt]      # hold RT alone: rare in combat
up = { spell = "Evocation" }
south = { macro = "ManaPot" }
west = { spell = "Cold Snap" }
north = { spell = "Frost Ward" }
east = { spell = "Remove Lesser Curse" }

[controller.none2]   # out of combat
up = { macro = "Drink" }
right = { macro = "Eat" }
down = { macro = "Hearth" }
left = { macro = "Mount" }

[controller.lt2]
up = { spell = "Frost Armor" }       # Ice Armor replaces it at 30
right = { spell = "Arcane Intellect" }
down = { spell = "Conjure Water" }
left = { spell = "Conjure Food" }
